<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetry Studio</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<div class="viz-root">
  <nav class="rail" aria-label="主导航">
    <div class="brand">
      <span class="dot-live" aria-hidden="true"></span>
      <h1>OmniToken</h1>
    </div>
    <!-- Overview is the landing page. All routes remain one direct click away
         in the compact top navigation. -->
    <div class="tabs" id="nav">
      <a href="#overview" data-view="overview" data-icon="overview">总览</a>
      <a href="#live" data-view="live" data-icon="live">实时</a>
      <a href="#speed" data-view="speed" data-icon="speed">速度</a>
      <a href="#reports" data-view="reports" data-icon="reports">报表</a>
      <a href="#details" data-view="details" data-icon="details">明细</a>
      <a href="#devices" data-view="devices" data-icon="devices">设备</a>
      <a href="#models" data-view="models" data-icon="models">模型</a>
      <a href="#cache" data-view="cache" data-icon="cache">缓存</a>
      <a href="#settings" data-view="settings" data-icon="settings">设置</a>
    </div>
  </nav>

  <div class="content" id="main-content" tabindex="-1">
  <div class="page-head">
    <div>
      <h2 id="page-title">总览</h2>
      <p class="subtitle" id="page-sub">累计与趋势</p>
    </div>
    <div class="page-utilities">
      <div class="hub-health" id="hub-health" aria-live="polite">
        <span class="health-dot" aria-hidden="true"></span>
        <span>Hub 检查中</span>
      </div>
      <div class="refresh" id="refresh-note"></div>
    </div>
  </div>

  <main id="view-overview" hidden></main>

  <main id="view-live" hidden>
    <!-- The strip leads. A number tile would say "here is a figure"; the strip
         says what the machines are doing right now, which is the job. -->
    <section class="now" id="now-block">
      <div class="figure"><span id="speed-tps">—</span><span class="unit"> tok/s</span></div>
      <div class="caption" id="speed-sub">正在等待数据</div>
    </section>

    <section id="live-telemetry-card"></section>

    <section class="card">
      <div class="card-head">
        <h2>并发生成</h2>
        <div class="head-tools"><span class="subtle" id="lane-note"></span></div>
      </div>
      <div class="lanes" id="lanes"></div>
      <div class="axis"><span id="axis-start">10 分钟前</span><span>现在</span></div>
    </section>

    <section class="grid-auto">
      <div class="card">
        <h2>新增 token 速率 · 近 10 分钟</h2>
        <div class="stat-tile plain">
          <div class="value" id="burn-rate">—</div>
          <div class="sub" id="burn-sub">&nbsp;</div>
        </div>
      </div>
      <div class="card"><h2>设备</h2><div id="live-devices" class="bars"></div></div>
    </section>

    <!-- Two different questions, deliberately side by side: what is open right
         now (process table, ADR-0012) vs what spent tokens lately. -->
    <section class="grid2">
      <div class="card">
        <div class="card-head"><h2>打开中的会话</h2>
          <div class="head-tools"><span class="subtle" id="procs-note"></span></div>
        </div>
        <div id="live-procs" class="data-table"></div>
      </div>
      <div class="card"><h2>近 10 分钟有用量</h2><div id="live-sessions" class="data-table"></div></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>额度</h2></div>
      <div class="stat-row" id="quota-row"></div>
      <div class="stat-row" id="window-row"></div>
    </section>

    <p class="subtle" id="live-status">连接中…</p>
  </main>

  <main id="view-reports" hidden></main>
  <main id="view-details" hidden></main>
  <main id="view-cache" hidden></main>
  <main id="view-speed" hidden></main>
  <main id="view-devices" hidden></main>
  <main id="view-models" hidden></main>
  <main id="view-settings" hidden></main>

  <div id="tooltip" class="tooltip" hidden></div>
</div>
</div>
<script src="vendor/echarts.min.js"></script>
<script src="api.js"></script>
<script src="icons.js"></script>
<script src="format-core.js"></script>
<script src="format.js"></script>
<script src="charts.js"></script>
<script src="telemetry.js"></script>
<script src="overview.js"></script>
<script src="live.js"></script>
<script src="reports.js"></script>
<script src="details.js"></script>
<script src="cacheview.js"></script>
<script src="speedview.js"></script>
<script src="heatmap.js"></script>
<script src="devicesview.js"></script>
<script src="modelsview.js"></script>
<script src="settingsview.js"></script>
<script src="app.js"></script>
</body>
</html>
