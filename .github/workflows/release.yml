# Release: manual milestone release of `dev` into `main`.
#
# Triggered by hand (workflow_dispatch). You pick a `bump` (major/minor); CI
# merges `dev` -> `main`, computes the next vX.Y.Z from the last tag, cross-
# compiles the five platform binaries with that version stamped in, tags the
# merge, generates a changelog, and publishes a GitHub Release carrying the
# binaries plus SHA256SUMS. `main` is NOT deployed per-feature — this is the
# only path that updates it.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        type: choice
        required: true
        default: minor
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

# Prevent two concurrent releases from computing the same "next version" and
# racing on the merge/tag/push.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: release-to-main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # need full history + tags for version + changelog

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # --- Merge dev -> main --------------------------------------------------
      - name: Merge dev into main
        run: |
          git fetch origin dev
          git merge --no-ff origin/dev -m "release: merge dev into main"

      # --- Compute next version from the last tag -----------------------------
      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          if LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null)"; then
            HAS_LAST_TAG=true
          else
            LAST_TAG="v0.0.0"
            HAS_LAST_TAG=false
          fi
          echo "Last tag: $LAST_TAG (found=$HAS_LAST_TAG)"
          VER="${LAST_TAG#v}"
          MAJOR="${VER%%.*}"; REST="${VER#*.}"; MINOR="${REST%%.*}"
          # A two-segment tag (v1.2) has no patch part. Test for the separator
          # first: ${REST#*.} returns REST unchanged when there is no dot, which
          # would otherwise make PATCH inherit MINOR.
          case "$REST" in
            *.*) PATCH="${REST#*.}" ;;
            *)   PATCH=0 ;;
          esac
          case "$PATCH" in ''|*[!0-9]*) PATCH=0 ;; esac
          case "${{ github.event.inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "unknown bump: ${{ github.event.inputs.bump }}" >&2; exit 1 ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "last=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "has_last_tag=$HAS_LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      # --- Generate changelog since the last tag ------------------------------
      # Write to a file (not a step output) so the arbitrary text in commit
      # subjects can never be interpolated back into a later shell command.
      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.has_last_tag }}" = "true" ]; then
            RANGE="${{ steps.version.outputs.last }}..HEAD"
          else
            # First release: no prior tag to diff from, so log full history.
            RANGE="HEAD"
          fi
          git log --pretty=format:'- %s (%h)' "$RANGE" > release-notes.md
          echo >> release-notes.md

      # --- Build the artifacts BEFORE anything is pushed -----------------------
      # A failed build here leaves the repo untouched: main is still only
      # merged locally and no tag exists yet. Building after the tag push
      # would strand a tag with no downloadable release.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile release binaries
        run: make release VERSION="${{ steps.version.outputs.next }}"

      # Lets users verify a download; `gh release create` uploads it alongside
      # the binaries. Computed inside dist/ so the file lists bare names.
      - name: Checksums
        working-directory: dist
        run: sha256sum omnitoken-* > SHA256SUMS

      # --- Tag + push main + tag (atomically) ---------------------------------
      - name: Tag and push
        run: |
          set -euo pipefail
          git tag -a "${{ steps.version.outputs.next }}" -m "Release ${{ steps.version.outputs.next }}"
          # --atomic: either both main and the tag land, or neither does —
          # avoids a merged-but-untagged main if the tag push half fails.
          git push --atomic origin main "${{ steps.version.outputs.next }}"

      # --- Create GitHub Release ----------------------------------------------
      # --notes-file (not --notes) so changelog content is never re-parsed as
      # shell syntax.
      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.version.outputs.next }}" \
            --target main \
            --title "${{ steps.version.outputs.next }}" \
            --notes-file release-notes.md \
            dist/omnitoken-* dist/SHA256SUMS scripts/install.sh scripts/install.ps1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The menubar app ships from the same tag, on a macOS runner because a .app
  # bundle cannot be cross-compiled. It runs after the release exists so the
  # artifacts can be attached to it rather than creating a second one.
  #
  # `latest.json` is what the in-app updater reads (ADR-0035). It is published as
  # a release asset so the check resolves through
  # releases/latest/download/latest.json — a static redirect, not the
  # rate-limited REST API. Same arrangement as the sibling OmniStats project.
  desktop:
    name: desktop-bundle
    needs: release
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      # The bundle carries its version in two files, and the updater compares
      # the one baked into the app against the manifest. If they disagree the
      # app either re-installs forever or never updates, so both are set from
      # the tag rather than maintained by hand.
      - name: Stamp version from the tag
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          VERSION="${VERSION#v}"
          python3 - "$VERSION" <<'PY'
          import json, re, sys
          version = sys.argv[1]
          p = "desktop/src-tauri/tauri.conf.json"
          conf = json.load(open(p))
          conf["version"] = version
          json.dump(conf, open(p, "w"), indent=2, ensure_ascii=False)
          open(p, "a").write("\n")
          c = "desktop/src-tauri/Cargo.toml"
          src = open(c).read()
          open(c, "w").write(re.sub(r'^version = "[^"]+"', f'version = "{version}"', src, count=1, flags=re.M))
          PY
          echo "stamped $VERSION"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # Signed here, verified in the app against the public key compiled into
      # the bundle. The private half exists only as this secret — losing it
      # means no installed copy can ever be updated again, because the pubkey it
      # trusts is baked in.
      - name: Build signed bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty — generate a key with \`cargo tauri signer generate\` and add it before releasing."
            exit 1
          fi
          cd desktop/src-tauri && cargo tauri build --bundles app

      - name: Write latest.json
        run: |
          set -euo pipefail
          VERSION="${{ needs.release.outputs.version }}"
          OUT=desktop/src-tauri/target/release/bundle/macos
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$VERSION" "$OUT" "$PUB_DATE" <<'PY'
          import json, pathlib, sys
          tag, out, pub_date = sys.argv[1], pathlib.Path(sys.argv[2]), sys.argv[3]
          sig = (out / "OmniToken.app.tar.gz.sig").read_text().strip()
          url = f"https://github.com/${{ github.repository }}/releases/download/{tag}/OmniToken.app.tar.gz"
          # Both macOS arches point at the same bundle: the runner builds for its
          # own arch, and an Intel Mac running it under Rosetta is still served a
          # working app. Publishing only darwin-aarch64 would make the updater
          # report "up to date" on an Intel Mac forever, which is worse.
          entry = {"signature": sig, "url": url}
          json.dump({
              "version": tag.lstrip("v"),
              "pub_date": pub_date,
              "platforms": {"darwin-aarch64": entry, "darwin-x86_64": entry},
          }, open("latest.json", "w"), indent=2)
          PY
          cat latest.json

      - name: Attach to the release
        run: |
          gh release upload "${{ needs.release.outputs.version }}" \
            desktop/src-tauri/target/release/bundle/macos/OmniToken.app.tar.gz \
            desktop/src-tauri/target/release/bundle/macos/OmniToken.app.tar.gz.sig \
            latest.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
