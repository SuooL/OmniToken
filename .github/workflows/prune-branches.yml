# Prune branches: delete `feature/*` remote branches whose PR merged into `dev`.
#
# The repo setting `delete-branch-on-merge` does NOT cover our flow: `ci.yml`
# enables GitHub auto-merge, so the merge happens later, when required checks
# pass, under the github-actions app whose job token is already gone. Observed
# 3 of 3 PRs keeping their branch. So this workflow — not the repo setting —
# is what actually deletes branches here.
#
# Runs on PR close (immediate), plus a weekly sweep and on demand as a backstop.

name: Prune branches

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    name: prune-merged-feature-branches
    runs-on: ubuntu-latest
    # On a PR event, only act when it actually merged — a closed-without-merge
    # PR must keep its branch. Scheduled/manual runs have no PR payload.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      # NOTE: this intentionally does NOT use `git branch --merged` /
      # ancestry checks. `ci.yml` auto-merges PRs with `--squash`, which
      # creates a brand-new commit on `dev` — the original feature-branch
      # commits are never reachable from `dev`, so an ancestry check would
      # never consider a squash-merged branch "merged" and this safety net
      # would silently prune nothing. Querying merged PRs via `gh` is
      # correct regardless of merge strategy, and as a side effect only ever
      # considers branches whose PR is actually MERGED (never a branch that
      # merely looks merged while still backing an open PR).
      - name: Delete feature/* branches whose PR merged into dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin --prune
          merged_branches="$(gh pr list --state merged --base dev \
            --json headRefName --jq '.[].headRefName' || true)"
          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            case "$branch" in
              feature/*) ;;
              *) continue ;;
            esac
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting merged remote branch: $branch"
              git push origin --delete "$branch" || echo "  (skip: could not delete $branch)"
            fi
          done <<< "$merged_branches"
