# Deploy Hub: event-driven deployment of a released `omnitoken` binary (Hub +
# embedded Web) to the production server over SSH, with automatic health-check
# rollback (ADR-0043).
#
# Triggered automatically by release.yml after publishing a new GitHub Release,
# or manually via workflow_dispatch (including rollback to an earlier tag).
# Never polls on a timer.
#
# Required repository secrets (when absent, deployment is skipped safely):
#   HUB_SSH_HOST         — Hub server hostname or IP
#   HUB_SSH_USER         — SSH login user (must have sudo for install/systemctl)
#   HUB_SSH_KEY          — SSH private key (OpenSSH PEM)
#
# Optional repository secrets / variables:
#   HUB_SSH_PORT         — SSH port (default: 22)
#   HUB_SSH_KNOWN_HOSTS  — pinned ssh-keyscan line(s) for strict host checking
#   HUB_BINARY_PATH      — target binary path (default: /usr/local/bin/omnitoken)
#   HUB_SERVICES         — space-separated systemd units to restart
#                          (default: "omnitoken-server omnitoken-agent")
#   HUB_HEALTH_URL       — local health URL checked on the Hub
#                          (default: http://127.0.0.1:8787/api/v1/health)

name: Deploy Hub

on:
  workflow_call:
    inputs:
      version:
        description: "Release tag to deploy (e.g. v0.5.0)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to deploy or roll back to (e.g. v0.5.0)"
        type: string
        required: true

concurrency:
  group: deploy-hub
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-hub
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        id: guard
        env:
          HUB_SSH_HOST: ${{ secrets.HUB_SSH_HOST }}
          HUB_SSH_USER: ${{ secrets.HUB_SSH_USER }}
          HUB_SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
        run: |
          if [ -z "$HUB_SSH_HOST" ] || [ -z "$HUB_SSH_USER" ] || [ -z "$HUB_SSH_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HUB_SSH_HOST / HUB_SSH_USER / HUB_SSH_KEY not configured; skipping automatic Hub deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version input
        if: steps.guard.outputs.configured == 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::invalid release tag: $VERSION" >&2; exit 1 ;;
          esac

      - name: Deploy release to Hub over SSH with health-check rollback
        if: steps.guard.outputs.configured == 'true'
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          HUB_SSH_HOST: ${{ secrets.HUB_SSH_HOST }}
          HUB_SSH_USER: ${{ secrets.HUB_SSH_USER }}
          HUB_SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
          HUB_SSH_PORT: ${{ secrets.HUB_SSH_PORT }}
          HUB_SSH_KNOWN_HOSTS: ${{ secrets.HUB_SSH_KNOWN_HOSTS }}
          HUB_BINARY_PATH: ${{ secrets.HUB_BINARY_PATH }}
          HUB_SERVICES: ${{ secrets.HUB_SERVICES }}
          HUB_HEALTH_URL: ${{ secrets.HUB_HEALTH_URL }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HUB_SSH_KEY" > "$HOME/.ssh/hub_deploy_key"
          chmod 0600 "$HOME/.ssh/hub_deploy_key"
          trap 'rm -f "$HOME/.ssh/hub_deploy_key"' EXIT

          PORT="${HUB_SSH_PORT:-22}"
          SSH_OPTS=(-i "$HOME/.ssh/hub_deploy_key" -p "$PORT" -o BatchMode=yes -o ConnectTimeout=15)
          if [ -n "$HUB_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$HUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            chmod 0600 "$HOME/.ssh/known_hosts"
            SSH_OPTS+=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          else
            SSH_OPTS+=(-o StrictHostKeyChecking=accept-new)
          fi

          BIN="${HUB_BINARY_PATH:-/usr/local/bin/omnitoken}"
          SERVICES="${HUB_SERVICES:-omnitoken-server omnitoken-agent}"
          HEALTH="${HUB_HEALTH_URL:-http://127.0.0.1:8787/api/v1/health}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          ssh "${SSH_OPTS[@]}" "${HUB_SSH_USER}@${HUB_SSH_HOST}" \
            "VERSION=$(printf %q "$VERSION") BASE_URL=$(printf %q "$BASE_URL") BIN=$(printf %q "$BIN") SERVICES=$(printf %q "$SERVICES") HEALTH=$(printf %q "$HEALTH") bash -s" <<'REMOTE'
          set -euo pipefail

          SUDO=""
          if [ "$(id -u)" != "0" ]; then
            SUDO="sudo"
          fi

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BACKUP_DIR="/var/backups/omnitoken"
          BACKUP_BIN="${BACKUP_DIR}/omnitoken-${STAMP}"
          $SUDO install -d -m 0755 "$BACKUP_DIR"
          if [ -x "$BIN" ]; then
            $SUDO cp -p "$BIN" "$BACKUP_BIN"
            echo "Backed up current binary to $BACKUP_BIN"
          fi

          rollback() {
            echo "::error::deployment health check failed; rolling back" >&2
            if [ -x "$BACKUP_BIN" ]; then
              $SUDO install -m 0755 "$BACKUP_BIN" "$BIN"
              for svc in $SERVICES; do
                if $SUDO systemctl is-active --quiet "$svc" || $SUDO systemctl is-enabled --quiet "$svc" 2>/dev/null; then
                  $SUDO systemctl restart "$svc" || true
                fi
              done
            fi
          }

          # Prefer built-in self-update when the installed binary already has it;
          # fall back to verified curl download for bootstrapping from older releases.
          if [ -x "$BIN" ] && "$BIN" self-update -h >/dev/null 2>&1; then
            echo "Upgrading via built-in self-update to $VERSION"
            $SUDO "$BIN" self-update -version "$VERSION" -base-url "$BASE_URL" -binary "$BIN" -allow-downgrade
          else
            echo "Bootstrapping upgrade to $VERSION via verified download"
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64|amd64) ASSET="omnitoken-linux-amd64" ;;
              arm64|aarch64) ASSET="omnitoken-linux-arm64" ;;
              *) echo "Unsupported arch: $ARCH" >&2; exit 1 ;;
            esac
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            curl -fsSL "${BASE_URL}/${ASSET}" -o "${TMP}/${ASSET}"
            curl -fsSL "${BASE_URL}/SHA256SUMS" -o "${TMP}/SHA256SUMS"
            WANT="$(awk -v a="$ASSET" '$2==a || $2=="*"a {print $1}' "${TMP}/SHA256SUMS" | head -1)"
            GOT="$(sha256sum "${TMP}/${ASSET}" | awk '{print $1}')"
            [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "Checksum mismatch" >&2; exit 1; }
            $SUDO install -m 0755 "${TMP}/${ASSET}" "${BIN}.new"
            $SUDO mv -f "${BIN}.new" "$BIN"
          fi

          for svc in $SERVICES; do
            if $SUDO systemctl is-active --quiet "$svc" || $SUDO systemctl is-enabled --quiet "$svc" 2>/dev/null; then
              echo "Restarting $svc"
              $SUDO systemctl restart "$svc"
            fi
          done

          ok=0
          for _ in $(seq 1 15); do
            if curl -fsS --max-time 2 "$HEALTH" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            rollback
            exit 1
          fi

          INSTALLED="$("$BIN" version)"
          echo "Active binary: $INSTALLED"
          case "$INSTALLED" in
            *"$VERSION"*) ;;
            *)
              echo "::error::version mismatch after deploy: got $INSTALLED, want $VERSION" >&2
              rollback
              exit 1
              ;;
          esac
          REMOTE
