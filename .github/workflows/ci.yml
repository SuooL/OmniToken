# CI: verify + auto-merge on PRs to `dev`.
#
# The verify job runs `make check` — the exact same command contributors run
# locally. Never inline the build/test/coverage commands here: a second copy
# would drift, and then "green locally, red in CI" becomes normal. Coverage
# thresholds live only in scripts/coverage-gate.sh.
#
# IMPORTANT: auto-merge only actually protects `dev` if the repo has
# BRANCH PROTECTION on `dev` with THIS job's check ("verify") set as a
# REQUIRED status check, plus "Allow auto-merge" enabled in repo settings.
# Without required checks, auto-merge would merge without waiting for CI.
# See .github/workflows/README.md.

name: CI

on:
  pull_request:
    branches: [dev]
    # Include ready_for_review so a draft PR marked ready re-triggers CI (and
    # therefore auto-merge) without needing an extra push. Defaults would
    # otherwise be [opened, synchronize, reopened].
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege by default; auto-merge needs PR write.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track the toolchain declared in go.mod rather than pinning it twice.
          go-version-file: go.mod
          cache: true

      # vet + tests + coverage gate + build — identical to running it locally.
      - name: Check
        run: make check

  auto-merge:
    name: enable-auto-merge
    needs: verify
    runs-on: ubuntu-latest
    # Don't auto-merge draft PRs.
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --match-head-commit pins the merge to the exact commit that just
      # passed `verify`. Without it, a commit pushed between `verify`
      # finishing and this step running could be the one that actually
      # merges once checks re-run and pass on it — never on an unverified sha.
      - name: Enable PR auto-merge
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
