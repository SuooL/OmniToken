# CI: verify + merge on PRs to `dev`.
#
# The verify job runs `make check` — the exact same command contributors run
# locally. Never inline the build/test/coverage commands here: a second copy
# would drift, and then "green locally, red in CI" becomes normal. Coverage
# thresholds live only in scripts/coverage-gate.sh.
#
# We merge directly instead of using `gh pr merge --auto`. GitHub does not
# create new workflow runs from events caused by GITHUB_TOKEN, and a deferred
# auto-merge lands after this job's token expires — so with `--auto` the head
# branch was never deleted (observed on 3 of 3 PRs), and neither the repo's
# `delete-branch-on-merge` setting nor a `pull_request: closed` workflow ever
# fired. Merging here, while the token is alive, makes `--delete-branch` work.
#
# This is only safe because `verify` is the sole required check on `dev`; it
# has already passed via `needs`. If you add another required check, this job
# must wait for it too (or go back to `--auto` and accept manual pruning).
# See .github/workflows/README.md.

name: CI

on:
  pull_request:
    branches: [dev]
    # Include ready_for_review so a draft PR marked ready re-triggers CI (and
    # therefore auto-merge) without needing an extra push. Defaults would
    # otherwise be [opened, synchronize, reopened].
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege by default; auto-merge needs PR write.
permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Track the toolchain declared in go.mod rather than pinning it twice.
          go-version-file: go.mod
          cache: true

      # vet + tests + coverage gate + build — identical to running it locally.
      - name: Check
        run: make check

  merge:
    name: squash-merge-and-delete-branch
    needs: verify
    runs-on: ubuntu-latest
    # Don't merge draft PRs.
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write
    steps:
      # --match-head-commit pins the merge to the exact commit that just
      # passed `verify`, so a commit pushed while this job was queued can
      # never be the one that lands — the merge fails instead.
      # --delete-branch runs in the same step, with a live token.
      - name: Squash-merge and delete branch
        run: gh pr merge --squash --delete-branch --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
