<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OmniToken</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="viz-root">
<div class="panel">
  <header>
    <span class="link" id="link" data-mode="" aria-live="polite">连接中…</span>
    <span class="device-head" id="device-head">—</span>
  </header>

  <main id="main" aria-live="polite">
    <section class="risk" id="risk" hidden>
      <div class="risk-copy">
        <div class="eyebrow" id="risk-source">配额风险</div>
        <div>
          <span class="risk-now" id="risk-now">—</span>
          <span class="risk-arrow">→</span>
          <span class="risk-projected" id="risk-projected">—</span>
          <span class="risk-reset" id="risk-reset"></span>
        </div>
      </div>
      <svg class="track" id="track" viewBox="0 0 354 42" preserveAspectRatio="none"
           role="img" aria-labelledby="track-desc">
        <desc id="track-desc"></desc>
        <line class="baseline" x1="2" y1="37.5" x2="352" y2="37.5"></line>
        <g id="track-ceiling">
          <text class="ceiling-tag" x="2" y="9">100%</text>
          <line class="ceiling" x1="28" y1="6.5" x2="352" y2="6.5"></line>
        </g>
        <path class="past" id="track-past" d=""></path>
        <path class="future" id="track-future" d=""></path>
        <path class="breach" id="track-breach" d=""></path>
        <circle class="nowdot" id="track-nowdot" r="2.6" cx="-9" cy="-9"></circle>
      </svg>
      <div class="axis">
        <span id="axis-start"></span>
        <span id="axis-hit"></span>
        <span id="axis-end"></span>
      </div>
    </section>

    <section class="activity" id="activity">
      <h1 id="activity-hero">活动未知</h1>
      <div class="session-list" id="session-list"></div>
      <div class="more" id="sessions-more" hidden></div>
    </section>

    <section class="summary-row quota-row">
      <span class="eyebrow">配额</span>
      <span class="summary-value" id="quota-summary">—</span>
      <span class="summary-tail" id="quota-reset"></span>
    </section>
    <div class="more" id="quotas-more" hidden></div>

    <section class="readouts">
      <div>
        <span class="eyebrow">燃烧</span>
        <span class="fig" id="burn-value">—</span>
      </div>
      <div>
        <span class="eyebrow">今日</span>
        <span class="fig" id="today-value">—</span>
      </div>
    </section>

    <section class="devices">
      <div class="section-head">
        <span class="eyebrow">设备</span>
        <span id="device-summary">无设备数据</span>
      </div>
      <div class="device-list" id="device-list"></div>
      <div class="more" id="devices-more" hidden></div>
    </section>
  </main>

  <section id="settings" class="settings" hidden>
    <label class="eyebrow" for="server-input">服务端地址</label>
    <input id="server-input" type="text" placeholder="127.0.0.1:8787"
           spellcheck="false" autocapitalize="off" autocorrect="off">
    <div class="hint">运行 <code>omnitoken serve</code> 的地址。省略 http:// 也可以。</div>
    <label class="eyebrow" for="token-input">访问令牌</label>
    <input id="token-input" type="password" placeholder="服务端只监听本机时留空"
           spellcheck="false" autocapitalize="off" autocorrect="off">
    <div class="hint">服务端监听非 loopback 地址时，读取需要 <code>config.json</code> 里的 <code>token</code>。</div>
    <div class="msg" id="settings-msg" aria-live="polite"></div>
    <div class="actions">
      <button type="button" id="settings-cancel">取消</button>
      <button type="button" id="settings-save" class="primary">保存</button>
    </div>
  </section>

  <footer>
    <button type="button" id="open-full" class="textlink">完整面板 ↗</button>
    <button type="button" id="open-settings" class="textlink">设置</button>
  </footer>
</div>
<script src="format-core.js"></script>
<script src="app.js"></script>
</body>
</html>
