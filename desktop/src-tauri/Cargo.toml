[package]
name = "omnitoken-desktop"
version = "0.1.0"
description = "OmniToken menubar client"
authors = ["suool"]
license = "MIT"
repository = "https://github.com/SuooL/OmniToken"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "omnitoken_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon: this app lives in the menubar, with no dock icon and no ordinary
# window.
#
# macos-private-api backs the transparent window, without which the rounded
# popover would sit on an opaque square. It rules out the Mac App Store, which
# is fine: distribution is via GitHub Releases like the server binary.
#
# image-png decodes the embedded gauge icons the tray swaps between.
tauri = { version = "2.11.3", features = [
  "tray-icon",
  "macos-private-api",
  "image-png",
] }
tauri-plugin-log = "2"
# The webview runs on tauri://localhost while the server sits elsewhere, and
# the server deliberately sends no CORS headers (ADR-0008: its read endpoints
# are unauthenticated, so allowing arbitrary origins would expose usage data to
# any visited page). All HTTP therefore happens here in Rust, which the
# same-origin policy does not constrain.
#
# rustls rather than the system TLS stack, to match the project's preference
# for builds that do not depend on what the host happens to provide.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
